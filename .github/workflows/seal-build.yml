name: seal-build

# Upstream json-smart-v2 ships no CI at 2.3; this workflow reproduces the
# release build (Maven 3.3.9, JDK 8 cross-compiling to Java 1.6, as the public
# jar's Build-Jdk 1.8.0_111 records) and runs the json-smart module's JUnit suite.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.3.9/binaries/apache-maven-3.3.9-bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.3.9/bin" >> "$GITHUB_PATH"

      - name: Install minidev-parent pom
        working-directory: parent
        run: |
          mvn -v
          mvn -B -e -N install -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true

      - name: Build and test json-smart
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -e -f json-smart/pom.xml clean package -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dsurefire.useFile=false -Dtest="${{ inputs.test-filter }}" -DfailIfNoTests=false
          else
            mvn -B -e -f json-smart/pom.xml clean package -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dsurefire.useFile=false
          fi

      - name: Print per-test results
        if: always()
        run: grep -h -o '<testsuite [^>]*>' json-smart/target/surefire-reports/TEST-*.xml

      - uses: actions/upload-artifact@v4
        with:
          name: json-smart-jar
          path: json-smart/target/json-smart-2.3.jar
          if-no-files-found: error
